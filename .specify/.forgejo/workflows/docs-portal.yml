name: Docs Portal

on:
  push:
    branches: [main]
    paths: ['docs-portal/**']
  pull_request:
    branches: [main]
    paths: ['docs-portal/**']

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-portal/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check i18n parity
        run: npm run docs:check-parity

      - name: Build
        run: npm run docs:build
