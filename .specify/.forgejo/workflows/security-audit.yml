name: Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Python dependency audit
        run: |
          pip install -e . pip-audit
          # PYSEC-2026-1325 (ecdsa): no fix available upstream at ecdsa's
          # latest release (0.19.2), transitive via python-jose.
          pip-audit --ignore-vuln PYSEC-2026-1325

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm dependency audit
        run: |
          npm ci
          npm audit --audit-level=high
